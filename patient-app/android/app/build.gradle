apply plugin: 'com.android.application'

android {
    namespace "com.swasthyaq.patient"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.swasthyaq.patient"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e4e2/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

configurations.all {
    resolutionStrategy {
        eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'org.jetbrains.kotlinx' && details.requested.name.startsWith('kotlinx-coroutines')) {
                details.useVersion(rootProject.ext.kotlinxCoroutinesVersion)
                details.because("Upgrade coroutines to ${rootProject.ext.kotlinxCoroutinesVersion} to eliminate transitive kotlin-stdlib-jdk7/jdk8:1.6.21")
            }
            if (details.requested.group == 'org.jetbrains.kotlin') {
                if (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8') {
                    details.useVersion(rootProject.ext.kotlin_version)
                    details.because("Align Kotlin stdlib-jdk7/jdk8 to ${rootProject.ext.kotlin_version}")
                }
            }
        }
    }
}

dependencies {
    implementation platform("org.jetbrains.kotlin:kotlin-bom:${rootProject.ext.kotlin_version}")
    implementation platform("org.jetbrains.kotlinx:kotlinx-coroutines-bom:${rootProject.ext.kotlinxCoroutinesVersion}")
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android"
    implementation "org.jetbrains.kotlin:kotlin-stdlib"

    constraints {
        implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:${rootProject.ext.kotlinxCoroutinesVersion}") {
            because("Upgrade kotlinx-coroutines to ${rootProject.ext.kotlinxCoroutinesVersion}")
        }
        implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:${rootProject.ext.kotlinxCoroutinesVersion}") {
            because("Upgrade kotlinx-coroutines to ${rootProject.ext.kotlinxCoroutinesVersion}")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:${rootProject.ext.kotlin_version}") {
            because("Align Kotlin stdlib-jdk7 to ${rootProject.ext.kotlin_version}")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:${rootProject.ext.kotlin_version}") {
            because("Align Kotlin stdlib-jdk8 to ${rootProject.ext.kotlin_version}")
        }
    }

    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
